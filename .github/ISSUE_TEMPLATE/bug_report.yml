name: Bug report
description: Something in the editor, the compositor, or the exporter is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please do not attach personal photos or videos — a synthetic
        file that reproduces the problem is worth more than the real one.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what the app actually did.
      placeholder: |
        Expected the hole to reveal my photo, but the template covered it completely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Drop a JPEG template with no transparency
        2. Drop a photo
        3. Click "Lanjut ke editor"
        4. Open "Hapus latar template" and click the middle of the frame
    validations:
      required: true

  - type: dropdown
    id: path
    attributes:
      label: Which path is affected
      multiple: true
      options:
        - Photo template
        - Video template
        - Photo media
        - Video media
        - PNG export
        - Video export
        - Cursor / interaction
        - Other
    validations:
      required: true

  - type: input
    id: files
    attributes:
      label: File types involved
      description: Format and approximate dimensions, e.g. "JPEG 1200×1200", "MP4 1080p 12 s".
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chromium 141, Firefox 145, Safari 19
    validations:
      required: true

  - type: textarea
    id: console
    attributes:
      label: Console output
      description: Any error from DevTools → Console, verbatim.
      render: shell
    validations:
      required: false

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: I reproduced this on the latest `master`.
          required: true
        - label: This is not a security issue (those go through SECURITY.md).
          required: true
