<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Base sun frame with transparent hole via evenodd -->
  <path fill="#F7CB46" fill-rule="evenodd" d="M 0 0 H 1080 V 1350 H 0 Z M 81 324 H 999 V 999 H 81 Z" />

  <!-- Top header section (outside slot) -->
  <g transform="translate(81, 40)">
    <!-- Tape / top pin -->
    <rect x="389" y="0" width="140" height="30" fill="#FFDCB8" stroke="#000000" stroke-width="4" rx="2" />

    <!-- Main title card -->
    <rect x="8" y="48" width="918" height="200" fill="#000000" rx="4" />
    <rect x="0" y="40" width="918" height="200" fill="#FFDCB8" stroke="#000000" stroke-width="6" rx="4" />

    <rect x="40" y="65" width="220" height="40" fill="#C0F7FE" stroke="#000000" stroke-width="4" rx="3" />
    <text x="150" y="92" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">BUKU TAHUNAN</text>

    <text x="459" y="165" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="4">KENANGAN KELAS</text>
    <text x="459" y="215" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#000000" text-anchor="middle" letter-spacing="6">CLASS OF 2026</text>
  </g>

  <!-- Slot border -->
  <rect x="81" y="324" width="918" height="675" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Photo frame corner clips -->
  <rect x="71" y="314" width="20" height="20" fill="#000000" />
  <rect x="989" y="314" width="20" height="20" fill="#000000" />
  <rect x="71" y="989" width="20" height="20" fill="#000000" />
  <rect x="989" y="989" width="20" height="20" fill="#000000" />

  <!-- Bottom notes section (outside slot) -->
  <g transform="translate(81, 1030)">
    <!-- Sticky note 1 -->
    <g transform="translate(0, 0)">
      <rect x="6" y="6" width="440" height="240" fill="#000000" rx="4" />
      <rect x="0" y="0" width="440" height="240" fill="#FFF8EC" stroke="#000000" stroke-width="6" rx="4" />
      <rect x="30" y="30" width="160" height="34" fill="#99E885" stroke="#000000" stroke-width="3" rx="2" />
      <text x="110" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">CATATAN KITA</text>
      <text x="30" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#000000">Tawa, cerita, dan</text>
      <text x="30" y="155" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#000000">perjalanan bersama</text>
      <text x="30" y="195" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" fill="#000000">yang selalu diingat</text>
    </g>

    <!-- Sticky note 2 -->
    <g transform="translate(478, 0)">
      <rect x="6" y="6" width="440" height="240" fill="#000000" rx="4" />
      <rect x="0" y="0" width="440" height="240" fill="#C0F7FE" stroke="#000000" stroke-width="6" rx="4" />
      <rect x="30" y="30" width="140" height="34" fill="#FE90E8" stroke="#000000" stroke-width="3" rx="2" />
      <text x="100" y="54" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#000000" text-anchor="middle">SOLIDARITAS</text>
      <text x="220" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#000000" text-anchor="middle">SATU KELAS</text>
      <text x="220" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="900" fill="#000000" text-anchor="middle">SATU KELUARGA</text>
    </g>
  </g>

  <!-- Outer frame border -->
  <rect x="4" y="4" width="1072" height="1342" fill="none" stroke="#000000" stroke-width="8" />
</svg>
