<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350">
  <!-- Base frame with transparent hole via evenodd -->
  <path fill="#E02424" fill-rule="evenodd" d="M 0 0 H 1080 V 1350 H 0 Z M 135 162 H 945 V 1107 H 135 Z" />

  <!-- Top bar decoration (outside slot) -->
  <rect x="0" y="0" width="1080" height="40" fill="#FFFFFF" />
  <line x1="0" y1="40" x2="1080" y2="40" stroke="#000000" stroke-width="6" />

  <!-- Top badge -->
  <g transform="translate(135, 60)">
    <rect x="0" y="0" width="810" height="80" fill="#FFFFFF" stroke="#000000" stroke-width="6" rx="4" />
    <text x="405" y="52" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="2">HUT REPUBLIK INDONESIA</text>
  </g>

  <!-- Slot border -->
  <rect x="135" y="162" width="810" height="945" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Corner accents on slot -->
  <rect x="120" y="147" width="30" height="30" fill="#F7CB46" stroke="#000000" stroke-width="5" />
  <rect x="930" y="147" width="30" height="30" fill="#F7CB46" stroke="#000000" stroke-width="5" />
  <rect x="120" y="1092" width="30" height="30" fill="#F7CB46" stroke="#000000" stroke-width="5" />
  <rect x="930" y="1092" width="30" height="30" fill="#F7CB46" stroke="#000000" stroke-width="5" />

  <!-- Bottom banner group (outside slot) -->
  <g transform="translate(135, 1135)">
    <!-- Shadow box -->
    <rect x="8" y="8" width="810" height="150" fill="#000000" rx="4" />
    <!-- White card -->
    <rect x="0" y="0" width="810" height="150" fill="#FFF8EC" stroke="#000000" stroke-width="6" rx="4" />
    <!-- Red decorative strip -->
    <rect x="20" y="20" width="770" height="20" fill="#E02424" stroke="#000000" stroke-width="3" />
    <text x="405" y="88" font-family="system-ui, -apple-system, sans-serif" font-size="44" font-weight="900" fill="#000000" text-anchor="middle" letter-spacing="3">17 AGUSTUS</text>
    <text x="405" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#E02424" text-anchor="middle" letter-spacing="4">NUSANTARA BARU INDONESIA MAJU</text>
  </g>

  <!-- Outer frame border -->
  <rect x="4" y="4" width="1072" height="1342" fill="none" stroke="#000000" stroke-width="8" />
</svg>
